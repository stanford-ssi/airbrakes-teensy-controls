; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; Airbrakes flying seal: /dev/cu.usbserial-AU0K3FHU
; On sled flying seal: /dev/cu.usbserial-AU0K4AAD

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-cli
; Exclude wifi_bringup.cpp from the main firmware — it has its own setup()/loop()
; and is only built via the wifi_bringup environment below.
src_filter = +<*> -<servoTest.cpp> -<wifi_bringup.cpp> -<esp32_passthrough.cpp>
lib_deps =
	sparkfun/SparkFun BNO080 Cortex Based IMU@^1.1.12

; ── WiFi hardware bringup smoke test ────────────────────────────────────────
; One-shot sketch that brings up the ESP32 AirLift as a WiFi access point and
; runs a TCP echo server on port 4040. Use this BEFORE wiring WiFi into the
; main firmware to verify pin assignments + AirLift firmware are good.
;   Build & flash:   pio run -e wifi_bringup -t upload
;   Then watch:      pio device monitor -e wifi_bringup
[env:wifi_bringup]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-cli
src_filter = +<wifi_bringup.cpp>
; Adafruit's WiFiNINA fork supports AirLift on non-MKR boards (Teensy, etc.).
; Pulled from GitHub because the upstream `arduino-libraries/WiFiNINA` on PIO
; registry is locked to `atmelsam` and won't install for the teensy platform.
lib_deps =
	https://github.com/adafruit/WiFiNINA.git

; ── ESP32 UART passthrough for reflashing NINA-FW ──────────────────────────
; Drops the AirLift into UART download mode and bridges USB serial to Serial1
; so esptool can reflash the ESP32. See src/esp32_passthrough.cpp for wiring
; + flash workflow.
[env:esp32_passthrough]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-cli
src_filter = +<esp32_passthrough.cpp>
; No lib_deps: passthrough only needs Arduino core (Serial + Serial1 + GPIO).
